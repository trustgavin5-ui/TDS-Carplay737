name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build App Archive
      run: |
        xcodebuild -list
        if [ -d "*.xcworkspace" ]; then
          xcodebuild -workspace *.xcworkspace -scheme "TDS Car Kit" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild -project *.xcodeproj -scheme "TDS Car Kit" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        fi

    - name: Export Unsigned IPA
      run: |
        mkdir -p build/Payload
        cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
        cd build && zip -r TDS-CarKit-unsigned.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tds-car-kit-ipa
        path: build/TDS-CarKit-unsigned.ipa
